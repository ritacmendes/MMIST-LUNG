    -   name: demographics
        type: tabular
        csv_path: ../lung/features/pretty/CPTAC+TCGA/demographics-encoded.csv
        single_token: False
        mask: False
        drop_cols:
            - demographic.days_to_death
            - days_to_last_fup
            - vital_status_dss

