patient_id_col: cases.submitter_id
target_label: vital_status_12
main_modality: demographics
mask_missing: True # FALSE FOR IMPUTATION; TRUE FOR MASKING (Transformer tokens)
folds_path: ../lung/folds/cptac-tcga.npy

fusion_strategy: early # early, late or attention
classifier: mlp # mlp or xgboost

modalities:
